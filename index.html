<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <title>Seguimiento a escala de la habitacion</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            touch-action: none;
        }
        #overlay-inicio {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(10, 10, 15, 0.9);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #btn-entrar {
            background-color: #107c10;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: background-color 0.2s;
            margin-top: 20px;
        }
        #btn-entrar:active { background-color: #0b520b; }
        #indicaciones {
            font-size: 14px;
            color: #aaa;
            max-width: 320px;
            line-height: 1.5;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 5;
            display: none;
        }
    </style>
</head>
<body>
    <div id="overlay-inicio">
        <h2>Escala de habitacion</h2>
        <p id="indicaciones">
            Este ejemplo demuestra el uso de un espacio de referencia de "piso local"
            para proporcionar seguimiento a escala de la habitacion.
        </p>
        <button id="btn-entrar">INICIAR EXPERIENCIA VR</button>
    </div>
    <div id="info">Cargando...</div>

    <script type="importmap">
    {
        "imports": {
            "three": "./build/three.module.js",
            "three/addons/": "./jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ==================== VARIABLES GLOBALES ====================
        let renderer, scene, camera;
        let xrSession = null;
        let xrRefSpace = null;
        let gl = null;

        let modeloEscena = null;
        let skyboxMesh = null;
        let boundsLine = null;

        const btnEntrar = document.getElementById('btn-entrar');
        const overlayInicio = document.getElementById('overlay-inicio');
        const infoDiv = document.getElementById('info');

        // ==================== INICIALIZACION ====================
        btnEntrar.addEventListener('click', async () => {
            if (!navigator.xr) {
                alert('WebXR no esta soportado en este navegador.');
                return;
            }
            try {
                const supported = await navigator.xr.isSessionSupported('immersive-vr');
                if (!supported) {
                    alert('immersive-vr no esta soportado en este dispositivo.');
                    return;
                }
                overlayInicio.style.display = 'none';
                infoDiv.style.display = 'block';
                infoDiv.textContent = 'Iniciando sesion VR...';
                await iniciarSesionVR();
            } catch (err) {
                console.error(err);
                alert('Error al iniciar VR: ' + err.message);
            }
        });

        function initThree() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            const canvas = document.createElement('canvas');
            document.body.appendChild(canvas);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.xr.enabled = true;

            gl = renderer.getContext();

            // Luces
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2.5);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
            dirLight.position.set(10, 25, 10);
            scene.add(dirLight);

            // Skybox equirectangular
            const texLoader = new THREE.TextureLoader();
            texLoader.load('textures/textura.png',
                (texture) => {
                    texture.mapping = THREE.EquirectangularReflectionMapping;
                    texture.colorSpace = THREE.SRGBColorSpace;
                    scene.background = texture;
                    scene.environment = texture;

                    // Esfera invertida como skybox visual (equivalente al SkyboxNode original)
                    const geo = new THREE.SphereGeometry(500, 60, 40);
                    geo.scale(-1, 1, 1);
                    const mat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide });
                    skyboxMesh = new THREE.Mesh(geo, mat);
                    scene.add(skyboxMesh);
                },
                undefined,
                (err) => {
                    console.warn('No se pudo cargar textures/textura.png');
                    scene.background = new THREE.Color(0x111122);
                }
            );

            // Modelo GLTF
            const loader = new GLTFLoader();
            loader.load('models/gltf/camp/ciudad.gltf',
                (gltf) => {
                    modeloEscena = gltf.scene;
                    modeloEscena.position.set(0, 0, 0);
                    modeloEscena.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                            if (node.material.map) node.material.map.colorSpace = THREE.SRGBColorSpace;
                        }
                    });
                    scene.add(modeloEscena);
                    infoDiv.textContent = 'Modelo cargado. Muevete para explorar.';
                },
                undefined,
                (error) => {
                    console.warn('No se pudo cargar models/gltf/camp/ciudad.gltf', error);
                    infoDiv.textContent = 'Error al cargar modelo. Usando geometria de respaldo.';
                    // Fallback: edificios simples
                    const grupo = new THREE.Group();
                    const boxGeom = new THREE.BoxGeometry(2, 5, 2);
                    const boxMat = new THREE.MeshStandardMaterial({ color: 0x445577 });
                    for (let x = -20; x <= 20; x += 8) {
                        for (let z = -20; z <= 20; z += 8) {
                            if (x === 0 && z === 0) continue;
                            const edif = new THREE.Mesh(boxGeom, boxMat);
                            edif.position.set(x, 2.5, z);
                            grupo.add(edif);
                        }
                    }
                    modeloEscena = grupo;
                    scene.add(modeloEscena);
                }
            );

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==================== WEBXR SESSION ====================
        async function iniciarSesionVR() {
            initThree();

            try {
                xrSession = await navigator.xr.requestSession('immersive-vr', {
                    requiredFeatures: ['local-floor'],
                    optionalFeatures: ['bounded-floor']
                });

                infoDiv.textContent = 'Sesion VR iniciada. Solicitando espacio de referencia...';

                const baseLayer = new XRWebGLLayer(xrSession, gl);
                xrSession.updateRenderState({ baseLayer: baseLayer });

                // Intentar bounded-floor primero, fallback a local-floor
                let refSpace;
                try {
                    refSpace = await xrSession.requestReferenceSpace('bounded-floor');
                    infoDiv.textContent = 'Espacio bounded-floor activo.';
                    dibujarLimites(refSpace);
                } catch (e) {
                    console.log('Falling back to local-floor reference space');
                    infoDiv.textContent = 'Usando local-floor (sin limites de habitacion).';
                    refSpace = await xrSession.requestReferenceSpace('local-floor');
                }

                xrRefSpace = refSpace;
                xrSession.requestAnimationFrame(onXRFrame);

            } catch (err) {
                console.error(err);
                infoDiv.textContent = 'Error: ' + err.message;
            }
        }

        function dibujarLimites(refSpace) {
            // Dibujar los bounds de la habitacion como lineas (equivalente a BoundsRenderer)
            if (!refSpace.boundsGeometry || refSpace.boundsGeometry.length === 0) return;

            const puntos = [];
            const geom = refSpace.boundsGeometry;
            for (let i = 0; i < geom.length; i++) {
                const p1 = geom[i];
                const p2 = geom[(i + 1) % geom.length];
                puntos.push(new THREE.Vector3(p1.x, p1.y, p1.z));
                puntos.push(new THREE.Vector3(p2.x, p2.y, p2.z));
            }

            const lineGeo = new THREE.BufferGeometry().setFromPoints(puntos);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff00, linewidth: 2 });
            boundsLine = new THREE.LineSegments(lineGeo, lineMat);
            scene.add(boundsLine);
        }

        // ==================== RENDER LOOP ====================
        function onXRFrame(time, frame) {
            const session = frame.session;
            session.requestAnimationFrame(onXRFrame);

            const pose = frame.getViewerPose(xrRefSpace);
            if (!pose) return;

            const layer = session.renderState.baseLayer;
            const glFrame = renderer.getContext();

            glFrame.bindFramebuffer(glFrame.FRAMEBUFFER, layer.framebuffer);

            for (const view of pose.views) {
                const viewport = layer.getViewport(view);
                glFrame.viewport(viewport.x, viewport.y, viewport.width, viewport.height);

                const camMatrix = new THREE.Matrix4().fromArray(view.transform.inverse.matrix);
                camera.projectionMatrix.fromArray(view.projectionMatrix);
                camera.matrix.copy(camMatrix);
                camera.matrix.decompose(camera.position, camera.quaternion, camera.scale);

                renderer.state.reset();
                renderer.render(scene, camera);
            }
        }

    </script>
</body>
</html>
