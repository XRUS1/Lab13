<!DOCTYPE html>
<html lang="en">
<head>
    <title>Three.js - Simulación Monoscópica 360 (Equivalente WebXR Inline)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <link rel="stylesheet" href="css/common.css">
    <style>
        body {
            touch-action: none;
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #overlay-inicio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 10, 15, 0.9);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #btn-entrar {
            background-color: #107c10;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: background-color 0.2s;
            margin-top: 20px;
        }
        #btn-entrar:active {
            background-color: #0b520b;
        }
        #indicaciones {
            font-size: 14px;
            color: #aaa;
            max-width: 320px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="overlay-inicio">
        <h2>Escala de habitacion</h2>
        <p id="indicaciones">Este ejemplo demuestra el uso de un espacio de simulación monoscópica para proporcionar seguimiento a escala de habitación usando el giro del teléfono.</p>
        <button id="btn-entrar">INICIAR EXPERIENCIA</button>
    </div>

    <canvas id="canvas3d"></canvas>

    <script async src="https://unpkg.com"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "./build/three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let camera, scene, renderer;
        let objetoManipulable;
        let eulerCamara = new THREE.Euler(0, 0, 0, 'YXZ');
        
        let alphaOffset = 0;
        let calibrado = false;

        const btnEntrar = document.getElementById('btn-entrar');
        const overlayInicio = document.getElementById('overlay-inicio');

        // Escucha táctil primaria obligatoria para Android
        btnEntrar.addEventListener('click', () => {
            // Desactivar y ocultar el overlay de interfaz inmediatamente al tacto
            overlayInicio.style.display = 'none';
            calibrado = false;

            // Arrancar el motor gráfico de Three.js de manera completamente síncrona dentro del click
            initEngine();

            // Enlazar los sensores del teléfono tras el gesto de usuario garantizado
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', onDeviceOrientation, false);
                        } else {
                            alert('Permiso de sensores requerido.');
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', onDeviceOrientation, false);
            }
        });

        function initEngine() {
            const canvas = document.getElementById('canvas3d');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.outputColorSpace = THREE.SRGBColorSpace;

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2.0);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(10, 25, 10);
            scene.add(directionalLight);

            // Iniciar el bucle de renderizado inmediatamente para renderizar buffers limpios
            animate();

            // Cargas asíncronas secundarias en segundo plano (No interrumpen la ejecución del render)
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load('media/textures/textura.png', (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                texture.colorSpace = THREE.SRGBColorSpace;
                
                const panoramaGeo = new THREE.SphereGeometry(500, 60, 40);
                panoramaGeo.scale(-1, 1, 1); 

                const panoramaMat = new THREE.MeshBasicMaterial({ map: texture });
                const panoramaMesh = new THREE.Mesh(panoramaGeo, panoramaMat);
                scene.add(panoramaMesh);
            }, undefined, (err) => {
                console.warn("No se encontró textura, usando color sólido.");
                scene.background = new THREE.Color(0x111122);
            });

            const loader = new GLTFLoader();
            loader.load('media/gltf/camp/ciudad.gltf', (gltf) => {
                objetoManipulable = gltf.scene;
                objetoManipulable.position.set(0, -1.0, 0);
                objetoManipulable.scale.set(1.0, 1.0, 1.0);
                
                objetoManipulable.traverse((node) => {
                    if (node.isMesh) {
                        node.material.depthWrite = true;
                        node.material.transparent = false;
                        node.material.side = THREE.DoubleSide;
                        if (node.material.map) node.material.map.colorSpace = THREE.SRGBColorSpace;
                    }
                });

                scene.add(objetoManipulable);
            }, undefined, (error) => {
                console.warn("No se encontró ciudad.gltf, ejecutando entorno geométrico.");
                objetoManipulable = new THREE.Group();
                const boxGeom = new THREE.BoxGeometry(2, 5, 2);
                const boxMat = new THREE.MeshStandardMaterial({ color: 0x445577 });
                for(let x = -20; x <= 20; x += 8) {
                    for(let z = -20; z <= 20; z += 8) {
                        if(x === 0 && z === 0) continue; 
                        const edificio = new THREE.Mesh(boxGeom, boxMat);
                        edificio.position.set(x, 2.5, z);
                        objetoManipulable.add(edificio);
                    }
                }
                scene.add(objetoManipulable);
            });

            window.addEventListener('resize', onWindowResize);
        }

        function onDeviceOrientation(event) {
            if (event.alpha === null || event.beta === null || event.gamma === null) return;

            if (!calibrado) {
                alphaOffset = event.alpha;
                calibrado = true;
            }

            let alphaRelativo = event.alpha - alphaOffset;
            if (alphaRelativo < 0) alphaRelativo += 360;

            const alphaRad = THREE.MathUtils.degToRad(alphaRelativo); 
            const betaRad  = THREE.MathUtils.degToRad(event.beta) - (Math.PI / 2);   
            const gammaRad = 0; 

            eulerCamara.set(betaRad, alphaRad, gammaRad, 'YXZ');
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!camera || !renderer || !scene) return;

            camera.position.set(0, 1.6, 0);

            if (calibrated) {
                camera.rotation.copy(eulerCamara);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
