<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Diorama 360</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div id="info">Toca la pantalla para activar el giroscopio</div>
  
  <script type="importmap">
  {
    "imports": {
      "three": "./build/three.module.js",
      "three/addons/": "./jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

    // ==========================================
    // CONFIGURACION
    // ==========================================
    const CAMERA_HEIGHT = 1.6;
    const CYLINDER_RADIUS = 60;
    const CYLINDER_HEIGHT = 200;   // Muy alto para no ver los bordes
    const SMOOTH_FACTOR = 0.08;
    const PITCH_LIMIT = THREE.MathUtils.degToRad(75); // Limitar a 75 grados

    // ==========================================
    // ESCENA, CAMARA, RENDERER
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Fallback azul cielo

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, CAMERA_HEIGHT, 0);

    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // ==========================================
    // LUCES
    // ==========================================
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // ==========================================
    // CILINDRO ENVOLVENTE (BackSide, sin tapas, muy alto)
    // ==========================================
    const texLoader = new THREE.TextureLoader();
    const panoTexture = texLoader.load(
      'textures/textura.png',
      undefined,
      undefined,
      (err) => {
        console.warn('Error cargando textura:', err);
      }
    );
    panoTexture.colorSpace = THREE.SRGBColorSpace;
    panoTexture.wrapS = THREE.RepeatWrapping;
    panoTexture.wrapT = THREE.ClampToEdgeWrapping;

    // openEnded: true = sin tapas. Altura 200 para que nunca se vean los bordes
    const cylinderGeo = new THREE.CylinderGeometry(
      CYLINDER_RADIUS, CYLINDER_RADIUS, CYLINDER_HEIGHT, 64, 1, true
    );
    const cylinderMat = new THREE.MeshBasicMaterial({
      map: panoTexture,
      side: THREE.BackSide,
      color: 0x888888 // Visible si la textura falla
    });
    const cylinder = new THREE.Mesh(cylinderGeo, cylinderMat);
    cylinder.position.y = CAMERA_HEIGHT; // Centrado a la altura de ojos
    scene.add(cylinder);

    // ==========================================
    // SUELO DE RESPALDO (por si el modelo no carga o no tiene base)
    // ==========================================
    const groundGeo = new THREE.PlaneGeometry(200, 200);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x3d5c2d });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    // ==========================================
    // MODELO GLTF
    // ==========================================
    const loader = new GLTFLoader();
    loader.load(
      'models/gltf/camp/ciudad.gltf',
      (gltf) => {
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        model.position.x = -center.x;
        model.position.z = -center.z;
        model.position.y = -box.min.y; // Base en Y = 0
        scene.add(model);
        console.log('Modelo cargado');
      },
      undefined,
      (error) => {
        console.error('Error cargando el modelo:', error);
      }
    );

    // ==========================================
    // GIROSCOPIO
    // ==========================================
    let isOrientationActive = false;
    let initialAlpha = null;

    const currentQ = new THREE.Quaternion();
    const targetQ = new THREE.Quaternion();
    const deviceEuler = new THREE.Euler(0, 0, 0, 'YXZ');

    function handleOrientation(event) {
      if (!isOrientationActive) return;

      // alpha: brujula (0-360)
      // beta: inclinacion frontal (-180 a 180). 90 = vertical
      // gamma: inclinacion lateral (-90 a 90)
      const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
      const beta = event.beta  ? THREE.MathUtils.degToRad(event.beta)  : 0;
      const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;

      if (initialAlpha === null) {
        initialAlpha = alpha;
      }

      // Yaw: relativo al primer toque
      let yaw = alpha - initialAlpha;

      // Pitch: offset de 90 grados para que vertical = horizonte
      // beta=90 (vertical) -> pitch=0 (mira al frente)
      // beta=0 (plano)    -> pitch=+90 (mira al cielo)
      // beta=180          -> pitch=-90 (mira al suelo)
      let pitch = -(beta - Math.PI / 2);

      // Limitar para no salirse del cilindro
      pitch = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, pitch));

      // Roll lateral
      let roll = -gamma;

      deviceEuler.set(pitch, yaw, roll, 'YXZ');
      targetQ.setFromEuler(deviceEuler);
    }

    function activateGyroscope() {
      const info = document.getElementById('info');

      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              isOrientationActive = true;
              info.style.display = 'none';
            } else {
              info.textContent = 'Permiso denegado';
            }
          })
          .catch((err) => {
            console.error(err);
            info.textContent = 'Error activando giroscopio';
          });
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        isOrientationActive = true;
        info.style.display = 'none';
      }
    }

    function onFirstInteraction() {
      if (!isOrientationActive) {
        activateGyroscope();
      }
    }

    document.body.addEventListener('touchstart', onFirstInteraction, {once: true});
    document.body.addEventListener('click', onFirstInteraction, {once: true});

    // ==========================================
    // BUCLE DE ANIMACION
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);

      if (isOrientationActive) {
        currentQ.slerp(targetQ, SMOOTH_FACTOR);
        camera.quaternion.copy(currentQ);
      }

      renderer.render(scene, camera);
    }

    // ==========================================
    // RESPONSIVE
    // ==========================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
