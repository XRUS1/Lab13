<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Diorama 360</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div id="info">Toca para activar</div>
  
  <script type="importmap">
  {
    "imports": {
      "three": "./build/three.module.js",
      "three/addons/": "./jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

    const CAMERA_HEIGHT = 1.6;
    const SMOOTH = 0.08;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, CAMERA_HEIGHT, 0);

    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dl = new THREE.DirectionalLight(0xffffff, 1.0);
    dl.position.set(10, 20, 10);
    scene.add(dl);

    // Skybox esferico (panorama 360)
    const tex = new THREE.TextureLoader().load('textures/textura.png');
    tex.colorSpace = THREE.SRGBColorSpace;
    const skyGeo = new THREE.SphereGeometry(500, 60, 40);
    skyGeo.scale(-1, 1, 1);
    const skyMat = new THREE.MeshBasicMaterial({map: tex, side: THREE.FrontSide});
    scene.add(new THREE.Mesh(skyGeo, skyMat));

    // Modelo
    new GLTFLoader().load('models/gltf/camp/ciudad.gltf', (gltf) => {
      const m = gltf.scene;
      const b = new THREE.Box3().setFromObject(m);
      const c = b.getCenter(new THREE.Vector3());
      m.position.set(-c.x, -b.min.y, -c.z);
      scene.add(m);
    });

    // Giroscopio
    let active = false;
    let initialQ = null;
    const currQ = new THREE.Quaternion();
    const targQ = new THREE.Quaternion();
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

    function onOrient(e) {
      if (!active) return;
      
      const alpha = e.alpha !== null ? THREE.MathUtils.degToRad(e.alpha) : 0;
      const beta = e.beta !== null ? THREE.MathUtils.degToRad(e.beta) : 0;
      const gamma = e.gamma !== null ? THREE.MathUtils.degToRad(e.gamma) : 0;
      
      const euler = new THREE.Euler();
      euler.set(beta, alpha, -gamma, 'YXZ');
      
      const deviceQ = new THREE.Quaternion().setFromEuler(euler);
      deviceQ.multiply(q1);
      
      if (initialQ === null) {
        initialQ = deviceQ.clone();
      }
      
      const inv = initialQ.clone().invert();
      targQ.multiplyQuaternions(inv, deviceQ);
    }

    function start() {
      if (active) return;
      window.addEventListener('deviceorientation', onOrient);
      active = true;
      document.getElementById('info').style.display = 'none';
    }

    document.body.addEventListener('touchstart', start, {once: true});
    document.body.addEventListener('click', start, {once: true});

    function animate() {
      requestAnimationFrame(animate);
      if (active) {
        currQ.slerp(targQ, SMOOTH);
        camera.quaternion.copy(currQ);
      }
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
