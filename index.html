<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Diorama 360</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div id="info">Toca para activar</div>
  
  <script type="importmap">
  {
    "imports": {
      "three": "./build/three.module.js",
      "three/addons/": "./jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

    const CAMERA_HEIGHT = 1.6;
    const CYLINDER_RADIUS = 60;
    const CYLINDER_HEIGHT = 200;
    const SMOOTH = 0.08;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, CAMERA_HEIGHT, 0);

    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dl = new THREE.DirectionalLight(0xffffff, 1.0);
    dl.position.set(10, 20, 10);
    scene.add(dl);

    // Cilindro texturizado, sin tapas, muy alto
    const tex = new THREE.TextureLoader().load('textures/textura.png');
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;

    const cyl = new THREE.Mesh(
      new THREE.CylinderGeometry(CYLINDER_RADIUS, CYLINDER_RADIUS, CYLINDER_HEIGHT, 64, 1, true),
      new THREE.MeshBasicMaterial({map: tex, side: THREE.BackSide})
    );
    cyl.position.y = CAMERA_HEIGHT;
    scene.add(cyl);

    // Suelo de respaldo
    const gnd = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({color: 0x3d5c2d})
    );
    gnd.rotation.x = -Math.PI / 2;
    scene.add(gnd);

    // Modelo
    new GLTFLoader().load('models/gltf/camp/ciudad.gltf', (gltf) => {
      const m = gltf.scene;
      const b = new THREE.Box3().setFromObject(m);
      const c = b.getCenter(new THREE.Vector3());
      m.position.set(-c.x, -b.min.y, -c.z);
      scene.add(m);
    });

    // Giroscopio
    let active = false;
    let initQ = null;
    const currQ = new THREE.Quaternion();
    const targQ = new THREE.Quaternion();

    // Correccion: telefono vertical = mirar al frente en Three.js
    const fixQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI/2, 0, 0, 'XYZ'));

    function sensorToQuaternion(a, b, g) {
      const r = Math.PI / 180;
      const aa = (a || 0) * r;
      const bb = (b || 0) * r;
      const gg = (g || 0) * r;
      const c1 = Math.cos(aa/2), c2 = Math.cos(bb/2), c3 = Math.cos(gg/2);
      const s1 = Math.sin(aa/2), s2 = Math.sin(bb/2), s3 = Math.sin(gg/2);
      // W3C: Z * Y * X
      return new THREE.Quaternion(
        s1*c2*c3 - c1*s2*s3,
        c1*s2*c3 + s1*c2*s3,
        c1*c2*s3 + s1*s2*c3,
        c1*c2*c3 - s1*s2*s3
      );
    }

    function onOrient(e) {
      if (!active) return;
      const q = sensorToQuaternion(e.alpha, e.beta, e.gamma);
      q.premultiply(fixQ); // Alinear ejes telefono -> Three.js
      if (initQ === null) initQ = q.clone().invert();
      targQ.multiplyQuaternions(q, initQ); // Relativo a posicion inicial
    }

    function start() {
      if (active) return;
      window.addEventListener('deviceorientation', onOrient);
      active = true;
      document.getElementById('info').style.display = 'none';
    }

    document.body.addEventListener('touchstart', start, {once: true});
    document.body.addEventListener('click', start, {once: true});

    function animate() {
      requestAnimationFrame(animate);
      if (active) {
        currQ.slerp(targQ, SMOOTH);
        camera.quaternion.copy(currQ);
      }
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
